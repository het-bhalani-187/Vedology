<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vedology — Ancient Wisdom, Modern Answers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0d0b08;
    --bg2:       #131009;
    --bg3:       #1a1510;
    --card:      #1e1912;
    --border:    #2e2718;
    --border2:   #3d3420;
    --gold:      #c8a84b;
    --gold2:     #e8c96d;
    --gold-dim:  #7a6530;
    --text:      #e8dfc8;
    --text2:     #a8997a;
    --text3:     #6a5e42;
    --red:       #c84b4b;
    --green:     #4b8c6a;
    --radius:    6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'EB Garamond', serif;
    font-size: 17px;
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Background geometry ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(200,168,75,0.04) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 0% 50%, rgba(200,168,75,0.02) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Header ── */
  header {
    position: relative;
    z-index: 10;
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    background: rgba(13,11,8,0.9);
    backdrop-filter: blur(8px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-mark {
    width: 36px;
    height: 36px;
    border: 1.5px solid var(--gold-dim);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .logo-mark::after {
    content: 'ॐ';
    font-size: 16px;
    color: var(--gold);
    line-height: 1;
  }

  .logo-text {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--gold2);
  }

  .logo-sub {
    font-family: 'EB Garamond', serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--text3);
    text-transform: uppercase;
    margin-top: 1px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text3);
    transition: background 0.3s;
  }
  .status-dot.online { background: var(--green); box-shadow: 0 0 6px rgba(75,140,106,0.5); }
  .status-dot.error  { background: var(--red); }

  .status-label {
    font-size: 12px;
    color: var(--text3);
    letter-spacing: 0.05em;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── Lang toggle ── */
  .lang-toggle {
    display: flex;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .lang-toggle button {
    padding: 5px 14px;
    font-size: 12px;
    letter-spacing: 0.08em;
    font-family: 'JetBrains Mono', monospace;
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    transition: all 0.2s;
  }
  .lang-toggle button.active {
    background: var(--gold-dim);
    color: var(--gold2);
  }

  /* ── Main layout ── */
  .main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 0;
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
    padding: 32px;
    gap: 24px;
  }

  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; padding: 16px; }
    .sources-panel { display: none; }
  }

  /* ── Chat panel ── */
  .chat-panel {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ── Welcome state ── */
  .welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    text-align: center;
    gap: 24px;
    transition: opacity 0.4s;
  }
  .welcome.hidden { display: none; }

  .welcome-mandala {
    width: 80px;
    height: 80px;
    border: 1px solid var(--border2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    color: var(--gold-dim);
    animation: spin-slow 30s linear infinite;
  }
  @keyframes spin-slow { to { transform: rotate(360deg); } }

  .welcome h1 {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--gold2);
    letter-spacing: 0.06em;
  }

  .welcome p {
    color: var(--text2);
    max-width: 420px;
    font-size: 16px;
    font-style: italic;
  }

  .suggested-queries {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 560px;
  }

  .suggestion-btn {
    padding: 7px 16px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text2);
    font-size: 13px;
    font-family: 'EB Garamond', serif;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .suggestion-btn:hover {
    border-color: var(--gold-dim);
    color: var(--gold);
    background: var(--bg3);
  }

  /* ── Messages ── */
  .messages {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    padding-right: 4px;
    max-height: calc(100vh - 280px);
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  /* ── Message bubbles ── */
  .msg {
    display: flex;
    gap: 12px;
    animation: msg-in 0.3s ease;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    margin-top: 4px;
  }

  .msg.user { flex-direction: row-reverse; }
  .msg.user .msg-avatar {
    background: var(--border2);
    color: var(--text2);
    font-family: 'Cinzel', serif;
  }
  .msg.assistant .msg-avatar {
    background: linear-gradient(135deg, var(--gold-dim), var(--border2));
    color: var(--gold2);
    font-size: 15px;
    border: 1px solid var(--gold-dim);
  }

  .msg-body { max-width: 88%; }

  .msg.user .msg-body {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 2px var(--radius);
    padding: 12px 16px;
    color: var(--text);
    font-style: italic;
  }

  .msg.assistant .msg-body {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 2px solid var(--gold-dim);
    border-radius: 2px var(--radius) var(--radius) var(--radius);
    padding: 16px 20px;
  }

  /* Format the structured answer */
  .msg.assistant .msg-body h3 {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin: 14px 0 4px;
    font-weight: 600;
  }
  .msg.assistant .msg-body h3:first-child { margin-top: 0; }
  .msg.assistant .msg-body p { color: var(--text); margin-bottom: 2px; }

  .msg-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    margin-top: 5px;
    text-align: right;
  }
  .msg.assistant .msg-time { text-align: left; }

  /* ── Thinking indicator ── */
  .thinking {
    display: flex;
    gap: 12px;
    animation: msg-in 0.3s ease;
  }
  .thinking-dots {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 2px solid var(--gold-dim);
    border-radius: 2px var(--radius) var(--radius) var(--radius);
    padding: 16px 20px;
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .thinking-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold-dim);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,60%,100% { opacity:0.3; transform:scale(0.8); } 30% { opacity:1; transform:scale(1); } }

  /* ── Input area ── */
  .input-area {
    margin-top: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .input-area:focus-within { border-color: var(--gold-dim); }

  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 0;
  }

  textarea {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'EB Garamond', serif;
    font-size: 16px;
    resize: none;
    min-height: 52px;
    max-height: 140px;
    line-height: 1.5;
  }
  textarea::placeholder { color: var(--text3); font-style: italic; }

  .send-btn {
    width: 48px;
    height: 48px;
    margin: 2px;
    background: var(--gold-dim);
    border: none;
    border-radius: 4px;
    color: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
    font-size: 18px;
  }
  .send-btn:hover { background: var(--gold); }
  .send-btn:disabled { background: var(--border); color: var(--text3); cursor: not-allowed; }

  .input-footer {
    padding: 6px 16px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .input-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
  }

  .char-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
  }

  /* ── Sources panel ── */
  .sources-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-header {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text3);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .sources-empty {
    color: var(--text3);
    font-style: italic;
    font-size: 14px;
    text-align: center;
    padding: 32px 0;
  }

  .source-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    animation: msg-in 0.3s ease;
    cursor: default;
    transition: border-color 0.2s;
  }
  .source-card:hover { border-color: var(--border2); }

  .source-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }

  .source-ref {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: var(--gold-dim);
    letter-spacing: 0.05em;
    line-height: 1.4;
    flex: 1;
    padding-right: 8px;
  }

  .source-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    background: var(--bg3);
    padding: 2px 6px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .source-text {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
    font-style: italic;
  }

  .source-tag {
    display: inline-block;
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--gold-dim);
    background: rgba(200,168,75,0.06);
    border: 1px solid rgba(200,168,75,0.12);
    padding: 2px 8px;
    border-radius: 3px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── Latency bar ── */
  .latency-bar {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    padding: 8px 0 0;
    border-top: 1px solid var(--border);
    margin-top: 8px;
    display: flex;
    gap: 16px;
  }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 4px 0;
  }

  /* ── Error message ── */
  .error-msg {
    background: rgba(200,75,75,0.08);
    border: 1px solid rgba(200,75,75,0.2);
    border-radius: var(--radius);
    padding: 12px 16px;
    color: #e89090;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark"></div>
    <div>
      <div class="logo-text">VEDOLOGY</div>
      <div class="logo-sub">Ancient Wisdom · Modern Answers</div>
    </div>
  </div>
  <div class="header-right">
    <div class="lang-toggle">
      <button class="active" onclick="setLang('english')">EN</button>
      <button onclick="setLang('hindi')">हि</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-label" id="status-label">checking...</span>
    </div>
  </div>
</header>

<div class="main">

  <!-- ── Chat panel ── -->
  <div class="chat-panel">

    <!-- Welcome screen -->
    <div class="welcome" id="welcome">
      <div class="welcome-mandala">ॐ</div>
      <h1>Ask the Ancient Texts</h1>
      <p>Wisdom from Chanakya Neeti, Garuda Purana, Katha Upanishad, Isha Upanishad, and Vidhur Niti.</p>
      <div class="suggested-queries" id="suggestions"></div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages" style="display:none"></div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-row">
        <textarea
          id="query-input"
          placeholder="Ask anything from the ancient scriptures..."
          rows="1"
          maxlength="500"
          onkeydown="handleKey(event)"
          oninput="handleInput(this)"
        ></textarea>
        <button class="send-btn" id="send-btn" onclick="sendQuery()" title="Send (Enter)">→</button>
      </div>
      <div class="input-footer">
        <span class="input-hint">Enter to send · Shift+Enter for new line</span>
        <span class="char-count" id="char-count">0 / 500</span>
      </div>
    </div>
  </div>

  <!-- ── Sources panel ── -->
  <div class="sources-panel">
    <div class="panel-header">Retrieved Passages</div>
    <div class="sources-empty" id="sources-empty">Sources will appear here after your first question.</div>
    <div id="sources-list"></div>
  </div>

</div>

<script>
const API = 'http://localhost:8000';
let currentLang = 'english';
let isLoading = false;

const SUGGESTIONS = [
  'What does Chanakya say about karma?',
  'How should one face death?',
  'What is the nature of the true Self?',
  'How to control the mind?',
  'What makes a wise person?',
  'What is the path to liberation?',
  'Duties of a good leader',
  'What is the nature of truth?',
];

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  renderSuggestions();
  await checkHealth();
  setInterval(checkHealth, 30000);
}

function renderSuggestions() {
  const el = document.getElementById('suggestions');
  SUGGESTIONS.forEach(q => {
    const btn = document.createElement('button');
    btn.className = 'suggestion-btn';
    btn.textContent = q;
    btn.onclick = () => {
      document.getElementById('query-input').value = q;
      handleInput(document.getElementById('query-input'));
      sendQuery();
    };
    el.appendChild(btn);
  });
}

async function checkHealth() {
  const dot = document.getElementById('status-dot');
  const label = document.getElementById('status-label');
  try {
    const r = await fetch(`${API}/health`, { signal: AbortSignal.timeout(3000) });
    const data = await r.json();
    if (data.retriever && data.ollama) {
      dot.className = 'status-dot online';
      label.textContent = 'ready';
    } else if (data.retriever) {
      dot.className = 'status-dot';
      label.textContent = 'ollama offline';
    } else {
      dot.className = 'status-dot error';
      label.textContent = 'not ready';
    }
  } catch {
    dot.className = 'status-dot error';
    label.textContent = 'api offline';
  }
}

// ── Language ──────────────────────────────────────────────────────────────────

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-toggle button').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && lang === 'english') || (i === 1 && lang === 'hindi'));
  });
  const ta = document.getElementById('query-input');
  ta.placeholder = lang === 'hindi'
    ? 'प्राचीन ग्रंथों से कुछ भी पूछें...'
    : 'Ask anything from the ancient scriptures...';
}

// ── Input handling ────────────────────────────────────────────────────────────

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendQuery();
  }
}

function handleInput(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
  document.getElementById('char-count').textContent = ta.value.length + ' / 500';
}

// ── Send query ────────────────────────────────────────────────────────────────

async function sendQuery() {
  const input = document.getElementById('query-input');
  const query = input.value.trim();
  if (!query || isLoading) return;

  // Show chat, hide welcome
  document.getElementById('welcome').classList.add('hidden');
  const messages = document.getElementById('messages');
  messages.style.display = 'flex';

  // Add user message
  appendMessage('user', query);

  // Clear input
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('char-count').textContent = '0 / 500';

  // Show thinking
  const thinkId = 'think-' + Date.now();
  appendThinking(thinkId);

  isLoading = true;
  document.getElementById('send-btn').disabled = true;

  // Clear old sources
  document.getElementById('sources-list').innerHTML = '';
  document.getElementById('sources-empty').style.display = 'block';
  document.getElementById('sources-empty').textContent = 'Retrieving passages...';

  try {
    const res = await fetch(`${API}/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, lang: currentLang, top_k: 5 }),
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    removeThinking(thinkId);
    appendAssistantMessage(data);
    renderSources(data.sources, data.latency_ms);

  } catch (err) {
    removeThinking(thinkId);
    appendError(err.message.includes('fetch') ? 'Cannot reach the API. Make sure api.py is running.' : err.message);
    document.getElementById('sources-empty').textContent = 'No sources retrieved.';
  }

  isLoading = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

// ── Message rendering ─────────────────────────────────────────────────────────

function appendMessage(role, text) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'user' ? 'U' : 'ॐ';

  const body = document.createElement('div');
  body.className = 'msg-body';
  body.textContent = text;

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  div.appendChild(avatar);
  const wrap = document.createElement('div');
  wrap.appendChild(body);
  wrap.appendChild(time);
  div.appendChild(wrap);

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function appendAssistantMessage(data) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = 'ॐ';

  const wrap = document.createElement('div');

  const body = document.createElement('div');
  body.className = 'msg-body';

  if (!data.found) {
    body.innerHTML = `<p style="color:var(--text2);font-style:italic">${escHtml(data.answer)}</p>`;
  } else {
    body.innerHTML = formatAnswer(data.answer);
  }

  const meta = document.createElement('div');
  meta.className = 'msg-time';
  meta.textContent = `${data.latency_ms.toFixed(0)}ms · ${data.sources.length} source${data.sources.length !== 1 ? 's' : ''} · ${data.lang}`;

  wrap.appendChild(body);
  wrap.appendChild(meta);
  div.appendChild(avatar);
  div.appendChild(wrap);

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function formatAnswer(text) {
  // Convert numbered sections into styled headers + paragraphs
  let html = escHtml(text);

  // Section headers: "1. Section Name:" or "1. Section Name\n"
  html = html.replace(/^(\d+\.\s+[A-Za-zऀ-ॿ\s]+?):\s*/gm, '<h3>$1</h3>');

  // Bullet points
  html = html.replace(/^[-•]\s+(.+)$/gm, '<p style="padding-left:12px;border-left:2px solid var(--border2)">$1</p>');

  // Paragraphs from double newlines
  const paras = html.split(/\n\n+/);
  return paras.map(p => {
    p = p.trim();
    if (!p) return '';
    if (p.startsWith('<h3>') || p.startsWith('<p')) return p;
    return `<p>${p.replace(/\n/g, '<br>')}</p>`;
  }).filter(Boolean).join('');
}

function appendThinking(id) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'thinking';
  div.id = id;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.style.cssText = 'width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dim),var(--border2));border:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--gold2);flex-shrink:0;margin-top:4px';
  avatar.textContent = 'ॐ';

  const dots = document.createElement('div');
  dots.className = 'thinking-dots';
  dots.innerHTML = '<span></span><span></span><span></span>';

  div.appendChild(avatar);
  div.appendChild(dots);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function removeThinking(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function appendError(msg) {
  const messages = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant';

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.style.cssText = 'width:32px;height:32px;border-radius:50%;background:rgba(200,75,75,0.15);border:1px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--red);flex-shrink:0;margin-top:4px';
  avatar.textContent = '!';

  const body = document.createElement('div');
  body.className = 'error-msg';
  body.textContent = msg;

  div.appendChild(avatar);
  div.appendChild(body);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

// ── Sources rendering ─────────────────────────────────────────────────────────

function renderSources(sources, latencyMs) {
  const empty = document.getElementById('sources-empty');
  const list = document.getElementById('sources-list');
  list.innerHTML = '';

  if (!sources || sources.length === 0) {
    empty.style.display = 'block';
    empty.textContent = 'No relevant passages found.';
    return;
  }

  empty.style.display = 'none';

  sources.forEach(s => {
    const card = document.createElement('div');
    card.className = 'source-card';

    card.innerHTML = `
      <div class="source-header">
        <div class="source-ref">${escHtml(s.reference)}</div>
        <div class="source-score">${(s.score * 100).toFixed(0)}%</div>
      </div>
      <div class="source-text">${escHtml(s.text)}</div>
      <div class="source-tag">${escHtml(s.source)}</div>
    `;

    list.appendChild(card);
  });

  // Latency
  const lat = document.createElement('div');
  lat.className = 'latency-bar';
  lat.innerHTML = `<span>retrieval + llm: ${latencyMs.toFixed(0)}ms</span><span>${sources.length} passages retrieved</span>`;
  list.appendChild(lat);
}

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── Start ─────────────────────────────────────────────────────────────────────

init();
</script>
